name: Build Portable Windows App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build with Maven
        run: |
          mvn clean package
          New-Item -ItemType Directory -Force -Path target/libs
          Copy-Item target/*.jar target/libs/

      - name: Create Portable App Image via jpackage
        run: |
          jpackage `
            --type app-image `
            --input target/libs `
            --main-jar Round_Robin-1.0-SNAPSHOT.jar `
            --main-class app.Launcher `
            --name "RRCalculator" `
            --icon src/main/resources/app/icon.ico `
            --dest target/dist

      - name: Compress Executable App to ZIP
        run: |
          Compress-Archive -Path target/dist/RRCalculator -DestinationPath target/RRCalculator-Windows-Portable.zip

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RRCalculator-Windows-Portable
          path: target/RRCalculator-Windows-Portable.zip
